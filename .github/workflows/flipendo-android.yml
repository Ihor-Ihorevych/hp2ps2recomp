# What Flipendo Droid's PS2 tab (Harry Potter and the Chamber of Secrets, PS2) runs on the phone, built on a Windows runner with the scripts
# in flipendo/ (Git Bash), and published as GitHub releases that Flipendo Droid's own build downloads:
#   toolchain-llvm20.1.8-ndk28.2   the compiler the phone translates a game with: libps2clang.so, libps2lld.so, sysroot.zip.
#                                  LLVM takes hours to build, so this is built only when that release does not exist yet.
#   runner-<commit>                the runner: libps2main.so, libSDL2ps2.so (SDL2's API over the app's SDL3).
# No game code or data is in any of it. See flipendo/README.md.
name: Flipendo Android

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flipendo-android.yml'
      - 'flipendo/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'host/**'
      - 'recomp/**'
      - 'runtime/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  # A change of LLVM_VER or the NDK in flipendo/build-toolchain.sh needs a new name here (and in Flipendo Droid's workflow).
  TOOLCHAIN_TAG: toolchain-llvm20.1.8-ndk28.2
  NDK_VERSION: 28.2.13676358
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  toolchain:
    runs-on: windows-latest
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Already built?
        id: have
        run: |
          have=true
          names="$(gh release view "$TOOLCHAIN_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          for f in libps2clang.so libps2lld.so sysroot.zip; do
            echo "$names" | grep -qx "$f" || have=false
          done
          echo "have=$have" >> "$GITHUB_OUTPUT"
          echo "$TOOLCHAIN_TAG already built: $have"

      - name: Android NDK 28
        if: steps.have.outputs.have != 'true'
        run: |
          SDKMANAGER="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null

      # the two table generators LLVM runs while it builds are compiled with this compiler
      - name: llvm-mingw
        if: steps.have.outputs.have != 'true'
        run: |
          cd /c
          curl -fsSL -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip
          echo "fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd  llvm-mingw.zip" | sha256sum -c -
          "/c/Program Files/7-Zip/7z.exe" x -y llvm-mingw.zip > /dev/null

      # the build is large: it goes on C: (the workspace disk is small), under a short path (Windows' 260-character limit)
      - name: Build the compiler for the phone
        if: steps.have.outputs.have != 'true'
        run: |
          export PATH="/c/llvm-mingw-20261020-ucrt-x86_64/bin:/c/Program Files/7-Zip:$PATH"
          mkdir -p /c/p flipendo-deps
          powershell -NoProfile -Command "New-Item -ItemType Junction -Path 'flipendo-deps\ps2cc' -Target 'C:\p' | Out-Null"
          ANDROID_NDK="$(cygpath -u "$ANDROID_HOME")/ndk/$NDK_VERSION" bash flipendo/build-toolchain.sh

      - name: Publish the compiler
        if: steps.have.outputs.have != 'true'
        run: |
          OUT=flipendo-deps/ps2cc/out
          gh release view "$TOOLCHAIN_TAG" > /dev/null 2>&1 || gh release create "$TOOLCHAIN_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Compiler for the phone (LLVM 20.1.8, NDK 28.2)" \
            --notes "clang and lld for aarch64-linux-android and a small sysroot, built by flipendo/build-toolchain.sh. Flipendo Droid packs them into its APK so the phone can translate a PS2 game from the player's own disc."
          gh release upload "$TOOLCHAIN_TAG" --clobber "$OUT/libps2clang.so" "$OUT/libps2lld.so" "$OUT/sysroot.zip"

  runner:
    needs: toolchain
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Android NDK 28 and CMake
        run: |
          SDKMANAGER="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: The compiler (build-ps2.sh packs it with the runner)
        run: |
          mkdir -p flipendo-deps/ps2cc/out
          gh release download "$TOOLCHAIN_TAG" --dir flipendo-deps/ps2cc/out --clobber \
            --pattern libps2clang.so --pattern libps2lld.so --pattern sysroot.zip

      - name: Build the runner
        run: ANDROID_NDK="$(cygpath -u "$ANDROID_HOME")/ndk/$NDK_VERSION" bash flipendo/build-ps2.sh

      - name: Publish the runner
        run: |
          TAG="runner-$(git rev-parse --short=9 HEAD)"
          OUT=flipendo-deps/ps2out
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "PS2 runner for Flipendo Droid ($TAG)" \
            --notes "libps2main.so (this repository at that commit, no game linked in) and libSDL2ps2.so (SDL2's API over the app's SDL3), for aarch64 Android. Flipendo Droid's build downloads them."
          gh release upload "$TAG" --clobber "$OUT/libps2main.so" "$OUT/libSDL2ps2.so"
          echo "Published $TAG"
